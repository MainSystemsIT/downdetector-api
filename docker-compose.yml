services:
  downdetector-api:
    build: .
    image: downdetector-api:latest
    container_name: downdetector-api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      BROWSER_USER_DATA_DIR: /browser-data
    shm_size: "1gb"
    volumes:
      - browser-data:/browser-data
    restart: unless-stopped

volumes:
  browser-data:
